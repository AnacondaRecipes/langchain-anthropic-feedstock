{% set name = "langchain-anthropic" %}
{% set version = "1.5.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 11cda4fac1129f229022a5c7a9be47156dea02ecf6e666acbb050943eb2df613

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - anthropic >=0.120.0,<1.0.0
    - langchain-core >=1.5.1,<2.0.0
    - pydantic >=2.7.4,<3.0.0

# both test_standard and test_chat_models require langchain_tests
# E   ModuleNotFoundError: No module named 'langchain_tests'
{% set ignore_tests = " --ignore=tests/unit_tests/test_standard.py --ignore=tests/unit_tests/test_chat_models.py" %}

test:
  source_files:
    - tests
  imports:
    - langchain_anthropic
  commands:
    - pip check
    - pytest -v --asyncio-mode=auto --confcutdir=tests/unit_tests tests/unit_tests {{ ignore_tests }}
  requires:
    - pip
    - pytest
    - freezegun
    - langchain
    - langgraph-prebuilt
    - langgraph-sdk
    - pytest-asyncio
    - pytest-mock

about:
  home: https://github.com/langchain-ai/langchain
  summary: An integration package connecting AnthropicMessages and LangChain
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: This package contains the LangChain integration for Anthropic's generative models.
  doc_url: https://reference.langchain.com/python/langchain-anthropic
  dev_url: https://github.com/langchain-ai/langchain/tree/master/libs/partners/anthropic

extra:
  recipe-maintainers:
    - jan-janssen
