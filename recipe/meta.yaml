{% set name = "langchain-anthropic" %}
{% set version = "0.3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: b4364434393476bf076c8326a51261a55d4e4cfefda01b8adf53533e8ebd8ec5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - pdm-backend
  run:
    - python
    - pydantic >=2.7.4,<3.0.0
    - langchain-core >=0.3.45,<1.0.0
    - anthropic >=0.49.0,<1
    # same as in the conda-forge:
    - defusedxml >=0.7.1,<1
  run_constrained:
    - defusedxml >=0.7.1,<1

# E   ModuleNotFoundError: No module named 'langchain_tests'
{% set ignore_tests = " --ignore=tests/unit_tests/test_standard.py" %}
test:
  source_files:
    - tests
  imports:
    - langchain_anthropic
  commands:
    - pip check
    - pytest -v tests/unit_tests {{ ignore_tests }}
  requires:
    - pip
    - pytest >=7.3.0,<8.0.0

about:
  home: https://github.com/langchain-ai/langchain
  summary: An integration package connecting AnthropicMessages and LangChain
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: This package contains the LangChain integration for Anthropic's generative models.
  doc_url: https://reference.langchain.com/python/integrations/langchain_anthropic
  dev_url: https://github.com/langchain-ai/langchain/tree/master/libs/partners/anthropic

extra:
  recipe-maintainers:
    - jan-janssen
